# CAVIAR multi-camera shopping corridor benchmark configuration.
# 2 synchronized cameras: cam01 (Corridor view) and cam02 (Frontal storefront view).
system:
  video_dir: ./data/caviar/videos
  output_dir: ./outputs/caviar_v1
  display_resolution: [1280, 720]

cameras:
  auto_discover: true
  topology:
    adjacency:
      cam01: [cam02]
      cam02: [cam01]
    min_transition_seconds: 0
    max_transition_seconds: 45

detector:
  model: yolo11n.pt
  device: auto
  confidence: 0.35
  classes: [0]

tracker:
  type: bytetrack
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30

features:
  reid:
    enabled: true
    model: osnet_ain_x1_0
    weight_path: ./models/osnet_ain_x1_0_msmt17_256x128.pth
    input_size: [256, 128]
    weight: 0.9
  color:
    enabled: true
    weight: 0.1
  motion:
    enabled: false
    weight: 0.0
  temporal:
    enabled: false
    weight: 0.0
  topology:
    enabled: false
  quality:
    enabled: true
    min_confidence: 0.4
    min_crop_pixels: [20, 50]
  geometry:
    enabled: false
  pose:
    enabled: false

association:
  similarity_threshold: 0.70
  clustering_method: average

output:
  video: outputs/caviar_v1/visualization/multi_camera.mp4
  save_tracklets: true

