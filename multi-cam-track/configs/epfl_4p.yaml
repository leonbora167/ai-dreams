# Compact EPFL laboratory smoke-test configuration.
# These cameras are synchronized and overlapping, so temporal/topology gating
# is disabled. Use configs/poc.yaml for non-overlapping camera experiments.
system:
  video_dir: ./data/videos
  output_dir: ./outputs/epfl_4p
  display_resolution: [1280, 720]
cameras:
  auto_discover: true
  topology: {adjacency: {}, max_transition_seconds: 30, min_transition_seconds: 0}
detector: {model: yolo11n.pt, device: cuda, confidence: 0.35, classes: [0]}
tracker: {type: bytetrack, track_high_thresh: 0.5, track_low_thresh: 0.1, new_track_thresh: 0.6, track_buffer: 30}
features:
  reid: {enabled: true, model: osnet_x1_0, input_size: [256, 128], weight: 0.9}
  color: {enabled: true, weight: 0.1}
  motion: {enabled: false, weight: 0.0}
  temporal: {enabled: false, weight: 0.0}
  topology: {enabled: false}
  quality: {enabled: true, min_confidence: 0.5, min_crop_pixels: [40, 90]}
  geometry: {enabled: false}
  pose: {enabled: false}
association: {similarity_threshold: 0.70, clustering_method: average}
output: {video: outputs/epfl_4p/visualization/multi_camera.mp4, save_tracklets: true}
